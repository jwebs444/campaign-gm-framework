[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-gm-framework"
version = "0.1.0"
description = "Campaign-independent GM workflow, evidence retrieval, and Roll20 inspection tools"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "jwebs444"}]
dependencies = []

[project.scripts]
campaign-gm = "gm_framework.cli:main"

[tool.setuptools.packages.find]
include = ["gm_framework*"]

[tool.setuptools.package-data]
gm_framework = ["templates/*.md", "templates/procedures/*.md"]
